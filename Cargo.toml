# SPDX-License-Identifier: GPL-2.0-or-later
[workspace]
resolver = "3"
members = ["core", "usb", "pc", "pcwrite", "cli", "wasm", "device-files"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/GlassineOS/installer"
publish = false

[profile.release]
opt-level = "s"
lto = true

# The executor's tests hash whole simulated partitions; unoptimised SHA-256
# makes them minutes long.
[profile.dev.package.sha2]
opt-level = 3
