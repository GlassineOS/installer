[package]
name = "glassine-install"
description = "The GlassineOS installer's command line: validate descriptions, check a machine, plan a dry run"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "glassine-install"
path = "src/main.rs"

[dependencies]
glassine-installer = { path = "../core" }
glassine-installer-usb = { path = "../usb" }
pollster = "0.4"
serde_json = "1"
