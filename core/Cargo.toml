# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name = "glassine-installer"
description = "The GlassineOS installer's core: device descriptions, recognition, plans and reports"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "preserve_order"] }
sha2 = { version = "0.10", default-features = false }
regex-lite = "0.1"

[dev-dependencies]
# Only to check that the generated schema validates what the validator does.
jsonschema = { version = "0.61", default-features = false }
# Drives the async fastboot session in the inspect tests.
pollster = "0.4"
