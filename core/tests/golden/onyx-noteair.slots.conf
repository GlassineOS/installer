# The Onyx Boox Note Air's second system, the one an installation keeps next to
# GlassineOS: the slot it starts from, for the shell's power menu entry "Android"
# (glassine-power-root). glassine-slot makes it active and marks it successful, then the
# device reboots into it.
# Derived from the device's description (/usr/share/glassine/device.toml) when its
# package is built: change the description, never this file.
ANDROID_SLOT=a
