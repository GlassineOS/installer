# The description copies this installer ships (spec 002 FR-027, FR-028): per
# copy, the repository it lives in, the version it is pinned to and the hash
# of its content. A copy that differs, an entry without a copy and a copy
# without an entry all fail the checks. "unpinned" is allowed only while the
# device's repository doesn't hold the description yet; CI fails once it does.

lock_format = 1

[[copies]]
file = "onyx-noteair.toml"
repository = "GlassineOS/bootstrap-onyx-noteair"
path = "devices/onyx-noteair.toml"
version = "unpinned"
sha256 = "a8462d8432b808245af1cb231909ec504140ce3b2bf3bf25d61c9c6a8d36ec9c"

[[copies]]
file = "uefi-pc.toml"
repository = "GlassineOS/installer"
path = "devices/uefi-pc.toml"
version = "this-repository"
sha256 = "69eae8ff881d9a5094332c611b7bdd2170c6c40a2a54937d109b1062ec9680a4"
