# SPDX-License-Identifier: GPL-2.0-or-later
# Spike: a minimal programmer for the SDM636 boot ROM's emergency mode (Sahara, 9008).
# Its own workspace, so the installer's workspace and toolchain stay untouched.
[package]
name = "glassine-edl-programmer"
version = "0.0.1"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false

[[bin]]
name = "programmer"
path = "src/main.rs"
test = false
bench = false

[features]
# Variant B: add the XBL_SEC-typed trampoline segment (link-xblsec.ld).
xbl-sec-trampoline = []
# Probes from the first device run (TESTPLAN.md): only the XBL_SEC segment differs from B.
probe-spin = ["xbl-sec-trampoline"]   # E: b .
probe-pshold = ["xbl-sec-trampoline"] # D: PS_HOLD low, b .
probe-ret = ["xbl-sec-trampoline"]    # F: ret
probe-unmask = ["xbl-sec-trampoline"] # U: mask, 1.0 s, unmask
probe-resets = ["xbl-sec-trampoline"] # R: PS_HOLD at 0.5 s, watchdog armed at 0.8 s, unmask at 2 s
probe-mask = ["xbl-sec-trampoline"]   # G: mask, spin
# The status image without any APSS watchdog access (in case probe R shows it faults).
no-wdt = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
panic = "abort"

[workspace]
