[package]
name = "fbspike"
version = "0.0.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false
description = "Spike: fastboot from one Rust core, native and over WebUSB (getvar, download to RAM, reboot)"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
nusb = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
